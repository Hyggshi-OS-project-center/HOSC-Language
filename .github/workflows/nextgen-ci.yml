name: HOSC Language CI
on:
  push:
    branches: ["insider"]
  pull_request:
    branches: ["insider"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Smoke Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build/cmake -DHOSC_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build/cmake --config Release --parallel

      - name: Test
        run: ctest --test-dir build/cmake -C Release --output-on-failure

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hosc-${{ matrix.os }}-binaries
          path: |
            build/cmake/bin/
          if-no-files-found: error
          retention-days: 7
