name: HOSC Language CI
on:
  push:
    branches: ["insider"]
  pull_request:
    branches: ["insider"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Smoke Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build/cmake -DHOSC_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build/cmake --config Release --parallel

      - name: Test
        run: ctest --test-dir build/cmake -C Release --output-on-failure

      - name: Stage package
        shell: bash
        run: |
          mkdir -p dist/bin dist/framework/bin
          if [ -d "build/cmake/bin/Release" ]; then
            cp -r build/cmake/bin/Release/* dist/bin/
            cp -r build/cmake/bin/Release/* dist/
          elif [ -d "build/cmake/bin" ]; then
            cp -r build/cmake/bin/* dist/bin/
            cp -r build/cmake/bin/* dist/
          fi
          cp -r framework/* dist/framework/
          if [ -f "dist/bin/hosc_framework" ]; then
            cp dist/bin/hosc_framework dist/framework/bin/
          fi
          if [ -f "dist/bin/hosc_framework.exe" ]; then
            cp dist/bin/hosc_framework.exe dist/framework/bin/
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: hosc-${{ matrix.os }}-binaries
          path: dist/
          if-no-files-found: error
          retention-days: 7
