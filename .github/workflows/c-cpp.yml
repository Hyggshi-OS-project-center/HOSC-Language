name: HOSC Language CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    name: Build and Smoke Test (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MinGW
        shell: pwsh
        run: |
          choco install mingw --no-progress -y

          $gcc = Get-ChildItem 'C:\ProgramData\chocolatey\lib\mingw\tools\install' -Filter gcc.exe -Recurse -ErrorAction Stop |
            Select-Object -First 1

          if (-not $gcc) {
            throw 'gcc.exe was not found after MinGW installation.'
          }

          $binDir = Split-Path -Parent $gcc.FullName
          $binDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify toolchain
        shell: pwsh
        run: |
          gcc --version
          g++ --version
          ar --version

      - name: Build tools
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\tools\build.ps1

      - name: Smoke test CLI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\build | Out-Null
          .\tools\bin\hosc.exe --version
          .\tools\bin\hosc.exe check .\examples\hello_world\hello.hosc
          .\tools\bin\hosc.exe build .\examples\hello_world\hello.hosc -o .\build\ci-hello.hbc

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hosc-windows-binaries
          path: |
            tools/bin/hosc.exe
            tools/bin/hosc_compiler.exe
            tools/bin/hvm.exe
            tools/bin/libhppapi.a
            build/ci-hello.hbc
          if-no-files-found: error
          retention-days: 7
