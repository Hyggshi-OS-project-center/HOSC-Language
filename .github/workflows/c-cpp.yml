name: HOSC Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Linux/Windows build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure CMake
        run: cmake -S . -B build/ci -DHOSC_BUILD_TESTS=ON
      - name: Build CMake targets
        run: cmake --build build/ci --config Release --parallel
      - name: Run CTest
        run: ctest --test-dir build/ci -C Release --output-on-failure
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: hosc-${{ matrix.os }}
          path: build/ci/bin/
          if-no-files-found: error
