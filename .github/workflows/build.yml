name: Build HOSC

on:
  push:
    branches: [main, insider]
  pull_request:
    branches: [main, insider]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: HOSC (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build/hosc -DHOSC_BUILD_TESTS=ON

      - name: Build HOSC
        run: cmake --build build/hosc --config Release --parallel

      - name: Run tests
        run: ctest --test-dir build/hosc -C Release --output-on-failure

      - name: Stage distribution package
        shell: bash
        run: |
          mkdir -p dist/bin dist/framework/bin
          if [ -d "build/hosc/bin/Release" ]; then
            cp -r build/hosc/bin/Release/* dist/bin/
            cp -r build/hosc/bin/Release/* dist/
          elif [ -d "build/hosc/bin" ]; then
            cp -r build/hosc/bin/* dist/bin/
            cp -r build/hosc/bin/* dist/
          fi
          cp -r framework/* dist/framework/
          if [ -f "dist/bin/hosc_framework" ]; then
            cp dist/bin/hosc_framework dist/framework/bin/
          fi
          if [ -f "dist/bin/hosc_framework.exe" ]; then
            cp dist/bin/hosc_framework.exe dist/framework/bin/
          fi

      - name: Upload HOSC package
        uses: actions/upload-artifact@v7
        with:
          name: hosc-${{ matrix.os }}
          path: dist/
          if-no-files-found: error
